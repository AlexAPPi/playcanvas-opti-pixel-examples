<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>OptiPixel</title>
    <style>
        html, body {
            margin: 0;
            height: 100%;
            background: #1b2430;
            color: #e7eef6;
            font: 14px/1.4 "Segoe UI", sans-serif;
        }

        #application {
            display: block;
            width: 100%;
            height: 100%;
            touch-action: none;
        }

        #library {
            position: fixed;
            z-index: 4;
            top: 8px;
            left: 8px;
            box-sizing: border-box;
            /* Leave the right-hand panel (220px, or the MiniStats gutter on a narrow screen). */
            max-width: calc(100vw - 24px - min(220px, 100vw - 208px));
            padding: 6px 10px;
            border-radius: 8px;
            background: rgba(16, 22, 30, 0.88);
            box-shadow: 0 8px 28px rgba(0, 0, 0, 0.28);
            color: #d6e6f5;
            font-size: 12px;
            font-weight: 650;
            line-height: 1.25;
            text-decoration: none;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        #library:hover {
            color: #fff;
            text-decoration: underline;
        }

        #library:focus {
            outline: none;
        }

        #library:focus-visible {
            outline: 1px solid #6d8eae;
            outline-offset: 2px;
        }

        #panel {
            position: fixed;
            z-index: 4;
            top: 8px;
            right: 8px;
            /* 168px MiniStats column, plus the gaps on either side of it. */
            width: min(220px, calc(100vw - 208px));
            max-height: calc(100vh - 16px);
            overflow: auto;
            padding: 8px 8px 6px;
            border-radius: 8px;
            background: rgba(16, 22, 30, 0.88);
            box-shadow: 0 8px 28px rgba(0, 0, 0, 0.28);
            font-size: 12px;
            line-height: 1.25;
        }

        h1 {
            margin: 0 0 4px;
            font-size: 13px;
            font-weight: 650;
        }

        .title-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            margin-bottom: 4px;
        }

        .title-row h1 {
            margin: 0;
        }

        #language {
            width: auto;
        }

        p {
            margin: 0 0 4px;
        }

        .hint, #error {
            color: #b7c5d4;
            font-size: 10px;
            line-height: 1.3;
        }

        #error {
            color: #ffb4a8;
            white-space: pre-wrap;
        }

        label {
            display: grid;
            grid-template-columns: 1fr auto;
            gap: 6px;
            align-items: center;
            margin: 2px 0;
        }

        label[hidden] {
            display: none;
        }

        label.stack {
            grid-template-columns: 1fr;
        }

        input[type="range"] {
            width: 100%;
        }

        select, button {
            font: inherit;
            color: inherit;
            background: #243140;
            border: 1px solid #3d5168;
            border-radius: 4px;
            padding: 1px 4px;
        }

        .fold {
            margin: 0;
            border-top: 1px solid rgba(61, 81, 104, 0.9);
        }

        .fold summary {
            display: flex;
            align-items: center;
            gap: 6px;
            margin: 0;
            padding: 7px 2px 4px;
            cursor: pointer;
            list-style: none;
            font-size: 11px;
            font-weight: 650;
            color: #c5d4e4;
            user-select: none;
        }

        .fold summary::-webkit-details-marker,
        .fold summary::marker {
            display: none;
            content: "";
        }

        .fold summary::before {
            content: "";
            flex: 0 0 auto;
            width: 0;
            height: 0;
            border-style: solid;
            border-width: 4px 0 4px 5px;
            border-color: transparent transparent transparent #8ea4b8;
            transform-origin: 40% 50%;
            transition: transform 0.15s ease;
        }

        .fold[open] > summary::before {
            transform: rotate(90deg);
        }

        .fold summary:hover {
            color: #fff;
        }

        .fold summary:focus {
            outline: none;
        }

        .fold summary:focus-visible {
            outline: 1px solid #6d8eae;
            outline-offset: 1px;
            border-radius: 3px;
        }

        .fold-body {
            padding: 0 0 4px 11px;
        }

        #stats {
            margin-top: 6px;
            padding-top: 6px;
            border-top: 1px solid rgba(61, 81, 104, 0.9);
            font-variant-numeric: tabular-nums;
        }

        .joystick {
            position: fixed;
            z-index: 5;
            box-sizing: border-box;
            width: 136px;
            height: 136px;
            border-radius: 50%;
            border: 2px solid rgba(231, 238, 246, 0.5);
            background: rgba(16, 22, 30, 0.34);
            box-shadow: inset 0 0 0 18px rgba(16, 22, 30, 0.18), 0 8px 28px rgba(0, 0, 0, 0.2);
            touch-action: none;
            user-select: none;
            -webkit-user-select: none;
        }

        .joystick[hidden] {
            display: none;
        }

        .joystick.is-active {
            right: auto;
            bottom: auto;
            background: rgba(16, 22, 30, 0.46);
            border-color: rgba(231, 238, 246, 0.82);
        }

        .joystick-knob {
            position: absolute;
            left: 50%;
            top: 50%;
            width: 52px;
            height: 52px;
            margin-left: -26px;
            margin-top: -26px;
            border-radius: 50%;
            background: rgba(231, 238, 246, 0.92);
            box-shadow: 0 4px 14px rgba(0, 0, 0, 0.28);
        }

        .joystick-label {
            position: absolute;
            left: 50%;
            top: -6px;
            transform: translate(-50%, -100%);
            color: #e7eef6;
            font-size: 11px;
            line-height: 1;
            white-space: nowrap;
            text-shadow: 0 1px 2px rgba(0, 0, 0, 0.65);
            pointer-events: none;
        }

        .debug-step {
            position: fixed;
            z-index: 6;
            box-sizing: border-box;
            width: 52px;
            height: 52px;
            margin: 0;
            padding: 0;
            border-radius: 14px;
            border: 2px solid rgba(231, 238, 246, 0.5);
            background: rgba(16, 22, 30, 0.72);
            color: #e7eef6;
            font: 650 26px/1 "Segoe UI", sans-serif;
            box-shadow: 0 8px 28px rgba(0, 0, 0, 0.28);
            touch-action: none;
            user-select: none;
            -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        .debug-step[hidden] {
            display: none;
        }

        .debug-step.is-active {
            background: rgba(231, 238, 246, 0.92);
            color: #10161e;
            border-color: rgba(231, 238, 246, 0.92);
        }

        .debug-step:focus {
            outline: none;
        }

        .debug-step:focus-visible {
            outline: 2px solid #e7eef6;
            outline-offset: 2px;
        }

        @media (pointer: coarse), (hover: none) {
            html, body, body * {
                -webkit-user-select: none;
                user-select: none;
                -webkit-touch-callout: none;
            }

            #panel {
                box-sizing: border-box;
                max-height: calc(100dvh - var(--stick-clearance, 176px) - env(safe-area-inset-bottom, 0px));
            }
        }
    </style>
</head>
<body>
    <a id="library" href="https://github.com/AlexAPPi/playcanvas-opti-pixel" target="_blank" rel="noopener noreferrer" data-i18n-title="libraryTitle" title="Библиотека playcanvas-opti-pixel">playcanvas-opti-pixel</a>
    <canvas id="application"></canvas>
    <aside id="panel">
        <div class="title-row">
            <h1>OptiPixel</h1>
            <select id="language" data-i18n-aria="language" aria-label="Язык">
                <option value="ru">Русский</option>
                <option value="en">English</option>
            </select>
        </div>
        <details class="fold" open>
            <summary><span data-i18n="sectionMode">Режим</span></summary>
            <div class="fold-body">
                <label>
                    <span data-i18n="device">Устройство</span>
                    <select id="device">
                        <option value="auto" data-i18n="deviceAuto">Авто</option>
                        <option value="webgpu">WebGPU</option>
                        <option value="webgl2">WebGL2</option>
                    </select>
                </label>
                <label>
                    <span data-i18n="tester">Тест</span>
                    <select id="tester">
                        <option value="1" selected>Coverage</option>
                        <option value="2">HZB</option>
                        <option value="3">Queries</option>
                        <option value="0" data-i18n="testerOff">Выкл</option>
                    </select>
                </label>
                <label>
                    <span data-i18n="hzbRenderer">Рендер HZB</span>
                    <select id="hzb-renderer" data-i18n-title="hzbRendererTitle" title="Как WebGPU строит пирамиду HZB">
                        <option value="compute">Compute</option>
                        <option value="pixel">Pixel</option>
                    </select>
                </label>
                <label>
                    <span data-i18n="depth">Глубина</span>
                    <select id="depth-source" data-i18n-title="depthTitle" title="Откуда HZB берёт глубину сцены">
                        <option value="grab">Depth grab</option>
                        <option value="camera-frame">CameraFrame</option>
                    </select>
                </label>
                <label>
                    <span data-i18n="encoding">Кодирование</span>
                    <select id="depth-encoding" data-i18n-title="encodingTitle" title="Linear — метры в R32F. Packed — RGBA8, если float render target недоступен. Reciprocal — 1/viewZ. Depth grab всегда device Z.">
                        <option value="linear">Linear</option>
                        <option value="packed">Packed</option>
                        <option value="reciprocal">Reciprocal</option>
                    </select>
                </label>
            </div>
        </details>
        <details class="fold" open>
            <summary><span data-i18n="sectionObjects">Сцена</span></summary>
            <div class="fold-body">
                <label class="stack">
                    <span><span data-i18n="capacity">Количество</span> <b id="capacity-value">100</b></span>
                    <input id="capacity" type="range" min="1" max="2000" step="1" value="100">
                </label>
                <label class="stack">
                    <span><span data-i18n="radius">Радиус</span> <b id="radius-value">48</b></span>
                    <input id="radius" type="range" min="8" max="120" step="1" value="48">
                </label>
                <label class="stack">
                    <span><span data-i18n="objectScale">Масштаб</span> <b id="object-scale-value">1.00</b></span>
                    <input id="object-scale" type="range" min="0.25" max="2.5" step="0.05" value="1" data-i18n-title="objectScaleTitle" title="Масштаб кубов, сфер и цилиндров за стеной. Стена не меняется.">
                </label>
            </div>
        </details>
        <details class="fold" open>
            <summary><span data-i18n="sectionBuffer">CoverageBuffer</span></summary>
            <div class="fold-body">
                <label id="coverage-width-row">
                    <span data-i18n="coverageWidth">Макс. ширина</span>
                    <select id="coverage-width" data-i18n-title="coverageWidthTitle" title="Потолок ширины карты Coverage: 16, 32, 64, 128, 256 или 512 текселей. Скачанный размер показан в статистике.">
                        <option value="16">16</option>
                        <option value="32">32</option>
                        <option value="64">64</option>
                        <option value="128">128</option>
                        <option value="256" selected>256</option>
                        <option value="512">512</option>
                    </select>
                </label>
                <label id="coverage-height-row">
                    <span data-i18n="coverageHeight">Макс. высота</span>
                    <select id="coverage-height" data-i18n-title="coverageHeightTitle" title="Потолок высоты карты Coverage: 16, 32, 64, 128, 256 или 512 текселей. Скачанный размер показан в статистике.">
                        <option value="16">16</option>
                        <option value="32">32</option>
                        <option value="64">64</option>
                        <option value="128" selected>128</option>
                        <option value="256">256</option>
                        <option value="512">512</option>
                    </select>
                </label>
                <label id="readback-slots-row">
                    <span data-i18n="readbackSlots">readbackSlots</span>
                    <select id="readback-slots" data-i18n-title="readbackSlotsTitle" title="Сколько чтений GPU→CPU держать в полёте. Минимум 2, по умолчанию 5. Смена сбрасывает ещё не дошедшие скачивания.">
                        <option value="1">1</option>
                        <option value="2">2</option>
                        <option value="3">3</option>
                        <option value="4">4</option>
                        <option value="5" selected>5</option>
                        <option value="6">6</option>
                        <option value="7">7</option>
                        <option value="8">8</option>
                    </select>
                </label>
                <label id="readback-lag-row">
                    <span data-i18n="minReadbackLag">minReadbackLag</span>
                    <select id="readback-lag" data-i18n-title="minReadbackLagTitle" title="Сколько вызовов frameUpdate ждать, прежде чем скопировать готовое скачивание на CPU. 0 — сразу, как готово. По умолчанию 2.">
                        <option value="0">0</option>
                        <option value="1">1</option>
                        <option value="2" selected>2</option>
                        <option value="3">3</option>
                        <option value="4">4</option>
                        <option value="5">5</option>
                        <option value="6">6</option>
                        <option value="7">7</option>
                        <option value="8">8</option>
                        <option value="9">9</option>
                        <option value="10">10</option>
                    </select>
                </label>
                <label id="readback-period-row">
                    <span data-i18n="readbackPeriod">readbackPeriod</span>
                    <select id="readback-period" data-i18n-title="readbackPeriodTitle" title="Упаковывать карту каждый N-й заход, пока есть свободный слот. Сбор идёт каждый кадр. По умолчанию 1, на Android — 3.">
                        <option value="0">0</option>
                        <option value="1" selected>1</option>
                        <option value="2">2</option>
                        <option value="3">3</option>
                        <option value="4">4</option>
                        <option value="5">5</option>
                        <option value="6">6</option>
                        <option value="7">7</option>
                        <option value="8">8</option>
                        <option value="9">9</option>
                        <option value="10">10</option>
                    </select>
                </label>
                <label id="cpu-readback-row">
                    <span data-i18n="cpuReadback">cpuReadback</span>
                    <input id="cpu-readback" type="checkbox" checked data-i18n-title="cpuReadbackTitle" title="Когда выключено, capture не пакует карту и не начинает чтение. Уже запущенное чтение всё равно публикуется.">
                </label>
            </div>
        </details>
        <details class="fold" open>
            <summary><span data-i18n="sectionDebug">Отладка</span></summary>
            <div class="fold-body">
                <label>
                    <span data-i18n="autoUpdate">Автообновление</span>
                    <input id="auto-update" type="checkbox" checked>
                </label>
                <label>
                    <span data-i18n="showBuffer">Показать буфер</span>
                    <input id="draw-hzb" type="checkbox" checked data-i18n-title="showBufferTitle" title="Пирамида HZB или карты Coverage">
                </label>
                <label>
                    <span data-i18n="debugObject">Отладка объекта</span>
                    <input id="debug" type="checkbox">
                </label>
                <label>
                    <span data-i18n="mipFullscreen">Mip на весь экран</span>
                    <input id="debug-mip" type="checkbox">
                </label>
                <label id="coverage-map-row">
                    <span data-i18n="map">Карта</span>
                    <select id="coverage-map" data-i18n-title="mapTitle" title="Что показать на весь экран: перепроекция текущего кадра или скачанный буфер">
                        <option value="reprojected" data-i18n="reprojected">Перепроекция</option>
                        <option value="downloaded" data-i18n="downloaded">Скачанный</option>
                    </select>
                </label>
                <label class="stack">
                    <span><span data-i18n="mipLevel">Уровень mip</span> <b id="mip-value">0</b></span>
                    <input id="mip-level" type="range" min="0" max="20" step="1" value="0">
                </label>
                <label class="stack">
                    <span><span data-i18n="mipOpacity">Непрозрачность mip</span> <b id="mip-opacity-value">1.00</b></span>
                    <input id="mip-opacity" type="range" min="0" max="1" step="0.01" value="1" data-i18n-title="mipOpacityTitle" title="Непрозрачность отладки mip и буфера. 1 — сплошная, 0 — прозрачная">
                </label>
            </div>
        </details>
        <p id="stats">Запуск…</p>
        <p id="hint" class="hint"></p>
        <p id="error"></p>
    </aside>
    <script type="module" src="/src/main.ts"></script>
</body>
</html>
